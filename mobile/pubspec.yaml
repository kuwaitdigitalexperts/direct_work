name: direct_job_kuwait
description: "Direct Work Kuwait - Official Mobile Application"
publish_to: 'none'

version: 1.0.40+42

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Networking & API (Laravel Backend)
  dio: ^5.7.0

  # Navigation & Deep Linking
  go_router: ^14.6.2

  # Persistence & Caching
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # UI & Media
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  intl: any
  url_launcher: ^6.3.1
  file_picker: ^10.0.0
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
